<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像の配置</title>

    <style>

        /* ① 大きな画像 */
        .image1 {
            background: url("https://techup.tokyo/wp-content/uploads/2021/12/image1.jpg") no-repeat 0 0;
            background-size: 900px 600px;
            position: relative;
            margin: 10px auto;
            width: 900px;
            height: 600px;
        }

        /* ② 小さい画像 */
        .image2 {
            position: absolute;
            top: 0;
            left: 0;
        }

        .image2 img {
            width: 300px;
            height: 200px;
        }

    </style>
</head>

<body>

    <div class="image1">

        <div class="image2">
            <img src="https://techup.tokyo/wp-content/uploads/2021/12/image2.jpg">
        </div>

    </div>

</body>
</html>
