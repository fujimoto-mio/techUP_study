
<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>JavaScriptBasic</title>
</head>
<body>
    <p>JavaScript Basic</p>

    <script>
        // 元の配列
        const array = ['read1', 'read2', 'read3', 'read4', 'read5'];

        // 0〜2番目を置き換えた新しい配列を作成
        const newArray = [
            'write_red',
            'write_blue',
            'write_yellow',
            ...array.slice(3)
        ];

        // 実行結果を表示
        console.log(newArray);
    </script>
</body>
</html>
