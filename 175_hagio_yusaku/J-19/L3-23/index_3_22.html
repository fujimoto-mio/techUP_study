
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>来年までのカウントダウン</title>

    <!-- CSSファイルを読み込む -->
    <link rel="stylesheet" href="index_3_22.css">

    <!-- JavaScriptファイルを読み込む -->
    <script src="index_3_22.js" defer></script>
</head>
<body>
    <main class="timer-container">
        <h1>COUNTDOWN TIMER</h1>

        <p class="message">
            2027年まであと
        </p>

        <!-- 残り時間を表示する場所 -->
        <div class="timer">
            <div class="time-box">
                <span id="hours">00</span>
                <span class="unit">時</span>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <span class="unit">分</span>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <span class="unit">秒</span>
            </div>
        </div>

        <p class="footer-message">
            HAPPY NEW YEAR!
        </p>
    </main>
</body>
</html>
