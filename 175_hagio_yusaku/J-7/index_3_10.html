
<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>JavaScriptBasic</title>
</head>
<body>
    <p>JavaScript Basic</p>

    <script>
        // 配列を準備
        const names = ['山田さん', '佐藤さん', '内田さん'];

        // 最初に配列の値を表示
        console.log('最初に配列の値を表示します。');

        for (let i = 0; i < names.length; i++) {
            console.log(names[i]);
        }

        // 配列の先頭から順番に削除
        while (names.length > 0) {
            const name = names.shift();

            console.log('配列の値を1つ消します。');
            console.log(name + 'を消しました。');

            // まだ配列にデータが残っている場合
            if (names.length !== 0) {
                console.log('残りを表示します。');

                for (let i = 0; i < names.length; i++) {
                    console.log(names[i]);
                }
            } else {
                // 配列が空になった場合
                console.log('データがなくなりました。');
            }
        }
    </script>
</body>
</html>
