<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タブ切り替え</title>

    <style>

        /* ラジオボタンを隠す */
        input[type="radio"] {
            display: none;
        }

        /* タブ全体 */
        .tab_wrap {
            width: 100%;
            border: solid 2px #999;
        }

        /* タブを置く場所 */
        .tab_area {
            text-align: center;
            padding-top: 20px;
        }

        /* タブ */
        .tab_area label {
            width: 150px;
            margin: 0 5px;
            display: inline-block;
            padding: 12px 0;
            color: #999;
            background: #ddd;
            text-align: center;
            font-size: 16px;
            cursor: pointer;

            /* アニメーション */
            transition: ease 0.2s opacity;
        }

        /* パネル */
        .tab_panel {
            display: none;
            padding: 20px 15px;
            font-size: 20px;
        }

        /* タブ1が選択されたとき */
        #tab1:checked ~ .tab_area .tab1_label {
            background: #fff;
            color: #000;
        }

        #tab1:checked ~ .panel_area #panel1 {
            display: block;
        }

        /* タブ2が選択されたとき */
        #tab2:checked ~ .tab_area .tab2_label {
            background: #fff;
            color: #000;
        }

        #tab2:checked ~ .panel_area #panel2 {
            display: block;
        }

        /* タブ3が選択されたとき */
        #tab3:checked ~ .tab_area .tab3_label {
            background: #fff;
            color: #000;
        }

        #tab3:checked ~ .panel_area #panel3 {
            display: block;
        }

    </style>
</head>

<body>

    <div class="tab_wrap">

        <!-- ラジオボタン -->
        <input id="tab1" type="radio" name="tab_btn" checked>
        <input id="tab2" type="radio" name="tab_btn">
        <input id="tab3" type="radio" name="tab_btn">

        <!-- タブ -->
        <div class="tab_area">
            <label class="tab1_label" for="tab1">タブ1</label>
            <label class="tab2_label" for="tab2">タブ2</label>
            <label class="tab3_label" for="tab3">タブ3</label>
        </div>

        <!-- 表示する内容 -->
        <div class="panel_area">

            <div id="panel1" class="tab_panel">
                <p>タブパネル-1</p>
            </div>

            <div id="panel2" class="tab_panel">
                <p>タブパネル-2</p>
            </div>

            <div id="panel3" class="tab_panel">
                <p>タブパネル-3</p>
            </div>

        </div>

    </div>

</body>
</html>
