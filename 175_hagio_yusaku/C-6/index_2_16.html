<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>絶対配置</title>

    <style>
        body {
            background-color: gray;
        }

        .logo-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            width: 480px;
            height: 190px;
            background-color: purple;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 360px;
            height: 130px;
            background-color: black;

            color: white;
            font-size: 50px;
            text-align: center;
            line-height: 130px;
        }
    </style>
</head>

<body>

    <div>背景表示</div>

    <div class="logo-area">
        <div class="logo">ロゴ表示</div>
    </div>

</body>
</html>
