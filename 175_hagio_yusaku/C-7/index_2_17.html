<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>子孫セレクター</title>

    <style>
        .box {
            background-color: #e9fffc;
            border-top: 10px solid #ff7d6e;
            box-shadow: 0 3px 5px gray;
            margin: 10px;
            padding: 20px;
        }

        .box p {
            color: #ff7d6e;
        }
    </style>
</head>

<body>

    <div class="box">
        <p>
            このような影（box-shadow）をつけて少し浮いたように見せた枠を作成してください。
        </p>
    </div>

</body>
</html>
