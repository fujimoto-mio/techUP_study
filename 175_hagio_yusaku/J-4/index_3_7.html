
<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>JavaScriptBasic</title>
</head>
<body>
    <p>JavaScript Basic</p>

    <script>
        // 今年の年を設定
        var year = 2022;

        // 干支を判定
        switch (year) {
            case 2020:
                console.log('子');
                break;
            case 2021:
                console.log('丑');
                break;
            case 2022:
                console.log('寅');
                break;
            case 2023:
                console.log('卯');
                break;
            case 2024:
                console.log('辰');
                break;
            case 2025:
                console.log('巳');
                break;
            case 2026:
                console.log('午');
                break;
            default:
                console.log('該当する干支がありません');
        }
    </script>
</body>
</html>
