
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScriptで画像をダウンロード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>画像のダウンロード</h1>

    <button onclick="doDownload(
        'https://images.unsplash.com/photo-1654964150054-2686fe33c993?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHx0b3BpYy1mZWVkfDF8RnpvM3p1T0hONnd8fGVufDB8fHx8&auto=format&fit=crop&w=500&q=60',
        'image.jpg'
    )">
        image.jpg をダウンロード
    </button>

    <script>
        'use strict';

        function doDownload(url, filename) {
            // XMLHttpRequestオブジェクトを作成
            var objXML = new XMLHttpRequest();

            // 画像を取得
            objXML.open("GET", url, true);

            // 取得するデータをBlob形式にする
            objXML.responseType = "blob";

            // ダウンロード完了時の処理
            objXML.onload = function () {
                if (objXML.status >= 200 && objXML.status < 300) {
                    var objBlob = objXML.response;

                    // Blobを参照するURLを作成
                    var objURL = window.URL.createObjectURL(objBlob);

                    // ダウンロード用のリンクを作成
                    var objLink = document.createElement("a");
                    document.body.appendChild(objLink);

                    objLink.href = objURL;
                    objLink.download = filename;

                    // リンクをクリックしてダウンロード
                    objLink.click();

                    // 後片付け
                    objLink.remove();
                    window.URL.revokeObjectURL(objURL);
                } else {
                    alert("画像の取得に失敗しました。");
                }
            };

            // 通信を開始
            objXML.send();
        }
    </script>
</body>
</html>
