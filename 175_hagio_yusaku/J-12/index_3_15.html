
<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>JavaScriptBasic</title>
</head>
<body>
    <p>JavaScript Basic</p>

    <script>
        // 課題①：コンストラクタを定義
        function Who(name) {
            this.name = name;
        }

        // 課題②：prototypeにインスタンスメソッドを設定
        Who.prototype.getName = function() {
            return this.name;
        };

        // インスタンスを作成し、tanakaを渡す
        const who = new Who('hagio');

        // 名前をConsoleに表示
        console.log(who.getName());
    </script>
</body>
</html>
