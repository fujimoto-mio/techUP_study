
<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>JavaScriptBasic</title>
</head>
<body>
    <ul class="list-group">
        <li class="list-group-item">100</li>
        <li class="list-group-item">110</li>
        <li class="list-group-item">120</li>
        <li class="list-group-item">130</li>
        <li class="list-group-item">140</li>
    </ul>

    <button id="changeButton">変更</button>
    <button id="resetButton">リセット</button>

    <script>
        // ul要素を取得
        var list = document.querySelector('.list-group');

        // ul要素の子要素であるli要素を取得
        var listItems = list.querySelectorAll('.list-group-item');

        // 初期値を格納する配列
        var initialValues = [];

        // 各li要素の初期値を取得して配列に格納
        listItems.forEach(function(li) {
            initialValues.push(parseInt(li.textContent));
        });

        // 変更ボタン
        document.getElementById('changeButton').addEventListener('click', function() {
            var items = list.querySelectorAll('.list-group-item');

            for (var i = 0; i < items.length; i++) {
                var value = parseInt(items[i].textContent);
                items[i].textContent = value * 10;
            }
        });

        // リセットボタン
        document.getElementById('resetButton').addEventListener('click', function() {
            var items = list.querySelectorAll('.list-group-item');

            items.forEach(function(item, index) {
                item.textContent = initialValues[index];
            });
        });
    </script>
</body>
</html>
