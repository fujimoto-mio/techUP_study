<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HTML divとspanの違い</title>
</head>

<body>

    <header>
        <h1>Header</h1>
    </header>

    <section>

        <div>
            <article>
                <h2>Article 1</h2>
                <p>一つ目の<span>アーティクル</span></p>
            </article>
        </div>

        <div>
            <article>
                <h2>Article 2</h2>
                <p>二つ目の<span>アーティクル</span></p>
            </article>
        </div>

    </section>

    <footer>
        <p>Footer</p>
    </footer>

</body>
</html>
